<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bamboo" x1="0" x2="1">
      <stop stop-color="#806039" />
      <stop offset=".3" stop-color="#d7b77d" />
      <stop offset=".58" stop-color="#edcf97" />
      <stop offset="1" stop-color="#9c743f" />
    </linearGradient>
    <linearGradient id="bristles" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f1e5cc" />
      <stop offset=".32" stop-color="#c7b99c" />
      <stop offset=".6" stop-color="#51463a" />
      <stop offset=".79" stop-color="#26231f" />
      <stop offset="1" stop-color="#161714" />
    </linearGradient>
    <filter id="edge" x="-40%" y="-10%" width="180%" height="125%">
      <feDropShadow dx=".4" dy=".4" stdDeviation=".35" flood-color="#fffaf0" flood-opacity=".9" />
    </filter>
  </defs>
  <g transform="translate(5 44) rotate(42)" filter="url(#edge)">
    <!-- Slender bamboo shaft with natural nodes and a dark end cap. -->
    <path d="M-1.85-49.3Q0-51.3 1.85-49.3L1.6-18.3H-1.6Z" fill="url(#bamboo)" stroke="#725536" stroke-width=".55" />
    <path d="M-1.8-48.8Q0-49.6 1.8-48.8L1.75-47.4H-1.75Z" fill="#4b3928" />
    <path d="M-1.8-39.4Q0-38.5 1.8-39.4M-1.7-28.2Q0-27.3 1.7-28.2" fill="none" stroke="#8a663b" stroke-width=".65" />
    <path
      d="M-.55-46.3-.5-40.8M-.5-37.8-.45-29.6M-.45-26.9-.4-20.6"
      fill="none"
      stroke="#f5dca5"
      stroke-width=".45"
      opacity=".7"
    />
    <!-- Narrow bound neck, rather than a wide paintbrush ferrule. -->
    <path d="M-2-19.8H2L2.3-16.9H-2.3Z" fill="#4c382a" stroke="#2e2721" stroke-width=".5" />
    <path d="M-2-18.8H2M-2.15-17.8H2.15" stroke="#b18d60" stroke-width=".4" />
    <!-- Soft bristles taper to the ink-loaded point at hotspot 5,44. -->
    <path
      d="M-2.2-17Q-5.2-14.5-4.1-10.3C-3.3-6.7-1.1-3.8 0 0C.6-4.4 3.4-7.9 4.1-11.2Q5-14.8 2.2-17Z"
      fill="url(#bristles)"
      stroke="#605343"
      stroke-width=".55"
    />
    <g fill="none" stroke-linecap="round">
      <path
        d="M-1.5-16.2Q-3.1-12.2-1.9-7.3M-.3-16.3Q-1.7-11.1-.8-6.6M1-16.2Q2-12.1 1.1-7.9M2-15.7Q3.4-12.5 2.1-9.3"
        stroke="#f0e3c8"
        stroke-width=".4"
        opacity=".8"
      />
      <path
        d="M-2.8-11.1Q-2-6.5 0 0M2.6-10.3Q1.6-5.3 0 0M.1-9.7Q.8-4.7 0 0"
        stroke="#29261f"
        stroke-width=".45"
        opacity=".8"
      />
    </g>
  </g>
</svg>
